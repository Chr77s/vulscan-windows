<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>JuiceCorp — Recherche</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
    .nav { background: #1e293b; color: white; padding: 14px 30px; display: flex; align-items: center; gap: 20px; }
    .nav h1 { font-size: 18px; }
    .nav a { color: #cbd5e1; text-decoration: none; font-size: 14px; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 30px; }
    .search-form { display: flex; gap: 10px; margin-bottom: 30px; }
    .search-form input { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .search-form button { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .results { background: white; padding: 24px; border-radius: 10px; min-height: 200px; }
    .results h3 { color: #4f46e5; margin-bottom: 12px; }
    .result-item { padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
  </style>
</head>
<body>

  <nav class="nav">
    <h1>🧃 JuiceCorp</h1>
    <a href="index.html">Accueil</a>
    <a href="search.html">Recherche</a>
  </nav>

  <div class="container">
    <h2 style="margin-bottom:14px">Rechercher dans le catalogue</h2>

    <form class="search-form" method="GET" action="search.html">
      <input type="text" name="q" id="q" placeholder="Ex : jus d'orange...">
      <button type="submit">Rechercher</button>
    </form>

    <div class="results" id="results">
      <h3>Résultats</h3>
      <div id="resultBody"><em>Tapez une requête ci-dessus.</em></div>
    </div>
  </div>

  <!-- VULN : XSS reflété - le paramètre 'q' est ré-injecté via innerHTML + document.write -->
  <script>
    var params = new URLSearchParams(window.location.search);
    var q = params.get("q");

    if (q) {
      // VULN 1 : assignation à innerHTML avec contenu utilisateur
      document.getElementById("resultBody").innerHTML =
        "<p>Vous avez recherché : <strong>" + q + "</strong></p>" +
        "<div class='result-item'>🥤 Aucun résultat pour « " + q + " »</div>";

      // VULN 2 : document.write avec contenu utilisateur
      document.write("<!-- recherche : " + q + " -->");

      // VULN 3 : eval pour "calculer" la longueur de la requête (absurde, exprès)
      try {
        var len = eval("'" + q + "'.length");
        console.log("Longueur :", len);
      } catch(e) { /* silence */ }
    }
  </script>

  <!-- VULN : commentaire HTML révélant des infos serveur -->
  <!-- TODO: connecter à la DB prod admin@10.0.1.42 -->
  <!-- DEBUG: stack trace last error : Traceback (most recent call last):
       File "/var/www/juicecorp/search.py", line 42, in handle_search
       sql_query = "SELECT * FROM products WHERE name = '" + q + "'"
       Exception: sqlite3.OperationalError: no such table -->
</body>
</html>
